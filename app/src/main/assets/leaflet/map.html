<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Leaflet Navigation Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #e5e7eb;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Clean Zoom Controls in Top-Left (like screenshot) */
    .leaflet-top.leaflet-left {
      top: 110px;
      left: 12px;
    }
    .leaflet-bar {
      border: none !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18) !important;
      border-radius: 12px !important;
      overflow: hidden;
    }
    .leaflet-bar a {
      background-color: #ffffff !important;
      color: #1e293b !important;
      border-bottom: 1px solid #f1f5f9 !important;
      width: 38px !important;
      height: 38px !important;
      line-height: 38px !important;
      font-size: 20px !important;
      font-weight: bold !important;
    }
    .leaflet-bar a:hover {
      background-color: #f8fafc !important;
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
      background: rgba(255, 255, 255, 0.85) !important;
      color: #64748b !important;
      padding: 2px 6px !important;
      border-radius: 4px;
      margin: 4px !important;
    }

    /* Map Legend Overlay (Top Right, matching screenshot) */
    .map-legend {
      position: absolute;
      top: 110px;
      right: 12px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      font-size: 11px;
      pointer-events: auto;
      min-width: 130px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }
    .legend-row:last-child {
      margin-bottom: 0;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .legend-line {
      width: 14px;
      height: 4px;
      border-radius: 2px;
      margin-right: 6px;
      flex-shrink: 0;
    }

    /* Live GPS Driver Puck */
    .driver-puck-container {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .driver-puck-pulse {
      position: absolute;
      width: 38px;
      height: 38px;
      background: rgba(16, 185, 129, 0.35);
      border-radius: 50%;
      animation: puck-pulse 2s infinite ease-out;
    }
    .driver-puck-body {
      position: relative;
      width: 32px;
      height: 32px;
      background: #10b981;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 16px;
      z-index: 2;
    }

    @keyframes puck-pulse {
      0% { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* Destination Stop Badge (Orange #1 from screenshot) */
    .stop-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .stop-badge-circle {
      width: 36px;
      height: 36px;
      background: #f59e0b;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      font-size: 14px;
      font-weight: 900;
    }
    .stop-badge-shadow {
      width: 14px;
      height: 4px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      margin-top: 2px;
      filter: blur(1px);
    }

    /* Custom Map Objects Pin */
    .object-pin-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .object-pin-badge:active {
      transform: scale(1.15);
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Map Legend (matching user screenshot) -->
  <div class="map-legend" id="mapLegend">
    <div class="legend-row">
      <div class="legend-dot" style="background:#10b981;"></div>
      <span>Live GPS</span>
    </div>
    <div class="legend-row">
      <div class="legend-dot" style="background:#f59e0b;"></div>
      <span>Destination (#1)</span>
    </div>
    <div class="legend-row">
      <div class="legend-dot" style="background:#0284c7;"></div>
      <span>Map Objects</span>
    </div>
    <div class="legend-row">
      <div class="legend-line" style="background:#ea580c;"></div>
      <span>Best Route</span>
    </div>
  </div>

  <script>
    var map;
    var userMarker = null;
    var startMarker = null;
    var endMarker = null;
    var routePolylineBg = null;
    var routePolyline = null;
    var tripPolyline = null;
    var tripPoints = [];
    var customObjectLayers = {};

    function initMap() {
      // Initialize map with top-left zoom controls like screenshot
      map = L.map('map', {
        center: [37.7749, -122.4194],
        zoom: 14,
        zoomControl: true,
        attributionControl: true
      });

      // CartoDB Voyager: Clear roads, highways, city labels, terrain, and coastlines (exactly matching screenshot)
      var voyagerLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 20,
        subdomains: 'abcd',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
      });

      // Fallback OSM layer in case of network edge issues
      var osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      });

      voyagerLayer.on('tileerror', function() {
        if (!map.hasLayer(osmLayer)) {
          osmLayer.addTo(map);
        }
      });

      voyagerLayer.addTo(map);

      map.on('click', function(e) {
        if (window.AndroidBridge && window.AndroidBridge.onMapClick) {
          window.AndroidBridge.onMapClick(e.latlng.lat, e.latlng.lng);
        }
      });

      if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
        window.AndroidBridge.onMapReady();
      }
    }

    function setCenter(lat, lng, zoom) {
      if (!map) return;
      if (zoom) {
        map.setView([lat, lng], zoom, { animate: true });
      } else {
        map.panTo([lat, lng], { animate: true });
      }
    }

    function updateUserPuck(lat, lng, heading) {
      if (!map) return;

      if (!userMarker) {
        var puckHtml = '<div class="driver-puck-container">' +
          '<div class="driver-puck-pulse"></div>' +
          '<div class="driver-puck-body">🚗</div>' +
        '</div>';

        var puckIcon = L.divIcon({
          className: 'custom-driver-puck',
          html: puckHtml,
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });

        userMarker = L.marker([lat, lng], { icon: puckIcon, zIndexOffset: 1000 }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lng]);
      }
    }

    // --- Live Ongoing Trip Trajectory (Green) ---
    function addTripPoint(lat, lng) {
      if (!map) return;
      var pt = [lat, lng];
      tripPoints.push(pt);

      if (!tripPolyline) {
        tripPolyline = L.polyline(tripPoints, {
          color: '#10b981',
          weight: 6,
          opacity: 0.9,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(map);
      } else {
        tripPolyline.setLatLngs(tripPoints);
      }
    }

    function clearTripTrajectory() {
      if (!map) return;
      tripPoints = [];
      if (tripPolyline) {
        map.removeLayer(tripPolyline);
        tripPolyline = null;
      }
    }

    // --- Start & Destination Pins (Orange #1 Stop like screenshot) ---
    function setStartDestinationPins(startLat, startLng, endLat, endLng, startTitle, endTitle) {
      if (!map) return;

      if (startMarker) map.removeLayer(startMarker);
      if (endMarker) map.removeLayer(endMarker);

      if (startLat !== null && startLng !== null) {
        var startHtml = '<div class="driver-puck-container">' +
          '<div class="driver-puck-body" style="background:#10b981;">🚚</div>' +
        '</div>';

        var startIcon = L.divIcon({
          className: 'start-puck',
          html: startHtml,
          iconSize: [40, 40],
          iconAnchor: [20, 20]
        });

        startMarker = L.marker([startLat, startLng], { icon: startIcon }).addTo(map);
        if (startTitle) startMarker.bindPopup('<b>Start:</b> ' + startTitle);
      }

      if (endLat !== null && endLng !== null) {
        // Orange #1 stop badge matching screenshot
        var endHtml = '<div class="stop-badge">' +
          '<div class="stop-badge-circle">#1</div>' +
          '<div class="stop-badge-shadow"></div>' +
        '</div>';

        var endIcon = L.divIcon({
          className: 'pin-end-stop',
          html: endHtml,
          iconSize: [36, 42],
          iconAnchor: [18, 40]
        });

        endMarker = L.marker([endLat, endLng], { icon: endIcon }).addTo(map);
        if (endTitle) endMarker.bindPopup('<b>Destination (#1):</b> ' + endTitle);
      }
    }

    // --- Route Path (Warm Orange like screenshot's "Best First Leg") ---
    function drawRoute(coordsJson, fit) {
      if (!map) return;
      clearRoute();

      try {
        var coords = (typeof coordsJson === 'string') ? JSON.parse(coordsJson) : coordsJson;
        if (!coords || coords.length === 0) return;

        var latLngs = coords.map(function(pt) { return [pt[0], pt[1]]; });

        // Dark amber/orange outer border
        routePolylineBg = L.polyline(latLngs, {
          color: '#9a3412',
          weight: 9,
          opacity: 0.85,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(map);

        // Vibrant orange core line matching screenshot
        routePolyline = L.polyline(latLngs, {
          color: '#ea580c',
          weight: 6,
          opacity: 1.0,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(map);

        if (fit) {
          map.fitBounds(routePolyline.getBounds(), {
            paddingTopLeft: [50, 100],
            paddingBottomRight: [50, 260],
            animate: true
          });
        }
      } catch (err) {
        console.error('Error drawing route:', err);
      }
    }

    function clearRoute() {
      if (!map) return;
      if (routePolylineBg) {
        map.removeLayer(routePolylineBg);
        routePolylineBg = null;
      }
      if (routePolyline) {
        map.removeLayer(routePolyline);
        routePolyline = null;
      }
    }

    function clearAll() {
      clearRoute();
      if (startMarker) {
        map.removeLayer(startMarker);
        startMarker = null;
      }
      if (endMarker) {
        map.removeLayer(endMarker);
        endMarker = null;
      }
    }

    // --- Custom Map Objects ---
    function renderCustomObjects(objectsJson) {
      if (!map) return;
      clearCustomObjects();

      try {
        var objects = (typeof objectsJson === 'string') ? JSON.parse(objectsJson) : objectsJson;
        if (!objects || !objects.length) return;

        objects.forEach(function(obj) {
          var color = obj.colorHex || '#0284c7';
          var lat = obj.latitude;
          var lng = obj.longitude;

          if (obj.objectType === 'circle' || obj.objectType === 'zone') {
            var radius = obj.radiusMeters || 150;
            var circle = L.circle([lat, lng], {
              radius: radius,
              color: color,
              weight: 2,
              fillColor: color,
              fillOpacity: 0.28
            });

            circle.on('click', function(e) {
              L.DomEvent.stopPropagation(e);
              if (window.AndroidBridge && window.AndroidBridge.onMapObjectClick) {
                window.AndroidBridge.onMapObjectClick(obj.id, obj.title, obj.objectType, lat, lng);
              }
            });

            circle.addTo(map);
            customObjectLayers[obj.id] = circle;
          } else {
            var iconSymbol = '📍';
            if (obj.objectType === 'hazard') iconSymbol = '⚠️';
            else if (obj.objectType === 'poi') iconSymbol = '⭐';
            else if (obj.objectType === 'camera') iconSymbol = '📷';

            var badgeHtml = '<div class="object-pin-badge" style="background-color:' + color + ';">' +
              '<span style="font-size:16px;">' + iconSymbol + '</span>' +
            '</div>';

            var icon = L.divIcon({
              className: 'custom-object-icon',
              html: badgeHtml,
              iconSize: [36, 36],
              iconAnchor: [18, 18]
            });

            var marker = L.marker([lat, lng], { icon: icon });
            marker.on('click', function(e) {
              L.DomEvent.stopPropagation(e);
              if (window.AndroidBridge && window.AndroidBridge.onMapObjectClick) {
                window.AndroidBridge.onMapObjectClick(obj.id, obj.title, obj.objectType, lat, lng);
              }
            });

            marker.addTo(map);
            customObjectLayers[obj.id] = marker;
          }
        });
      } catch (err) {
        console.error('Error rendering custom objects:', err);
      }
    }

    function clearCustomObjects() {
      if (!map) return;
      for (var id in customObjectLayers) {
        if (customObjectLayers.hasOwnProperty(id)) {
          map.removeLayer(customObjectLayers[id]);
        }
      }
      customObjectLayers = {};
    }

    function zoomIn() {
      if (map) map.zoomIn();
    }

    function zoomOut() {
      if (map) map.zoomOut();
    }

    window.onload = initMap;
  </script>
</body>
</html>
