<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Leaflet Navigation Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
      background: rgba(15, 23, 42, 0.7) !important;
      color: #94a3b8 !important;
      padding: 2px 6px !important;
      border-radius: 4px;
      margin: 4px !important;
    }
    .leaflet-control-attribution a {
      color: #38bdf8 !important;
      text-decoration: none;
    }

    /* Custom Pulsing User Location Puck */
    .user-puck-container {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .puck-heading-cone {
      position: absolute;
      top: -12px;
      left: 10px;
      width: 24px;
      height: 24px;
      opacity: 0.6;
      transform-origin: 50% 100%;
      pointer-events: none;
      transition: transform 0.2s ease-out;
    }

    .puck-pulse {
      position: absolute;
      width: 32px;
      height: 32px;
      background: rgba(14, 165, 233, 0.35);
      border-radius: 50%;
      animation: puck-pulse-animation 2s infinite ease-out;
    }

    .puck-dot {
      position: relative;
      width: 16px;
      height: 16px;
      background: #0284c7;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      z-index: 2;
    }

    @keyframes puck-pulse-animation {
      0% {
        transform: scale(0.6);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    /* Custom Pins */
    .custom-pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .pin-shadow {
      width: 12px;
      height: 4px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      margin-top: -2px;
      filter: blur(1px);
    }
    .step-marker-dot {
      width: 12px;
      height: 12px;
      background: #ffffff;
      border: 3px solid #0284c7;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    .step-marker-active {
      width: 18px;
      height: 18px;
      background: #f59e0b;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #f59e0b;
      animation: pulse-step 1s infinite alternate;
    }

    /* Custom Added Map Objects */
    .object-pin-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .object-pin-badge:active {
      transform: scale(1.15);
    }

    @keyframes pulse-step {
      from { transform: scale(0.9); }
      to { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    var map;
    var userMarker = null;
    var startMarker = null;
    var endMarker = null;
    var stepMarkers = [];
    var routePolylineBg = null;
    var routePolyline = null;
    var activeTileLayer = null;
    var customObjectLayers = {};

    // Tile providers
    var tileProviders = {
      streets: {
        url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        options: { maxZoom: 19, attribution: '&copy; OpenStreetMap' }
      },
      light: {
        url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
        options: { maxZoom: 19, attribution: '&copy; CARTO' }
      },
      dark: {
        url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        options: { maxZoom: 19, attribution: '&copy; CARTO' }
      },
      satellite: {
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        options: { maxZoom: 18, attribution: '&copy; Esri World Imagery' }
      },
      terrain: {
        url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
        options: { maxZoom: 17, attribution: '&copy; OpenTopoMap' }
      }
    };

    function initMap() {
      map = L.map('map', {
        center: [37.7749, -122.4194],
        zoom: 14,
        zoomControl: false,
        attributionControl: true
      });

      setTileLayer('light');

      map.on('click', function(e) {
        if (window.AndroidBridge && window.AndroidBridge.onMapClick) {
          window.AndroidBridge.onMapClick(e.latlng.lat, e.latlng.lng);
        }
      });

      if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
        window.AndroidBridge.onMapReady();
      }
    }

    function setTileLayer(type) {
      if (!tileProviders[type]) type = 'light';
      if (activeTileLayer) {
        map.removeLayer(activeTileLayer);
      }
      var cfg = tileProviders[type];
      activeTileLayer = L.tileLayer(cfg.url, cfg.options);
      activeTileLayer.addTo(map);
    }

    function setCenter(lat, lng, zoom) {
      if (!map) return;
      if (zoom) {
        map.setView([lat, lng], zoom, { animate: true });
      } else {
        map.panTo([lat, lng], { animate: true });
      }
    }

    function updateUserPuck(lat, lng, heading) {
      if (!map) return;
      var headingAngle = heading || 0;

      if (!userMarker) {
        var puckHtml = '<div class="user-puck-container">' +
          '<svg class="puck-heading-cone" id="headingCone" viewBox="0 0 24 24">' +
            '<path fill="#0284c7" d="M12 2 L22 22 L12 17 L2 22 Z"/>' +
          '</svg>' +
          '<div class="puck-pulse"></div>' +
          '<div class="puck-dot"></div>' +
        '</div>';

        var puckIcon = L.divIcon({
          className: 'custom-puck-icon',
          html: puckHtml,
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });

        userMarker = L.marker([lat, lng], { icon: puckIcon, zIndexOffset: 1000 }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lng]);
      }

      var coneElem = document.getElementById('headingCone');
      if (coneElem) {
        coneElem.style.transform = 'rotate(' + headingAngle + 'deg)';
      }
    }

    function setStartDestinationPins(startLat, startLng, endLat, endLng, startTitle, endTitle) {
      if (!map) return;

      if (startMarker) map.removeLayer(startMarker);
      if (endMarker) map.removeLayer(endMarker);

      if (startLat !== null && startLng !== null) {
        var startHtml = '<div class="custom-pin">' +
          '<svg width="32" height="38" viewBox="0 0 32 38" fill="none">' +
            '<path d="M16 0C7.163 0 0 7.163 0 16C0 27 16 38 16 38C16 38 32 27 32 16C32 7.163 24.837 0 16 0Z" fill="#0284c7"/>' +
            '<circle cx="16" cy="15" r="7" fill="#ffffff"/>' +
            '<circle cx="16" cy="15" r="4" fill="#0284c7"/>' +
          '</svg>' +
          '<div class="pin-shadow"></div>' +
        '</div>';

        var startIcon = L.divIcon({
          className: 'pin-start',
          html: startHtml,
          iconSize: [32, 40],
          iconAnchor: [16, 38]
        });

        startMarker = L.marker([startLat, startLng], { icon: startIcon }).addTo(map);
        if (startTitle) startMarker.bindPopup('<b>Start:</b> ' + startTitle);
      }

      if (endLat !== null && endLng !== null) {
        var endHtml = '<div class="custom-pin">' +
          '<svg width="34" height="42" viewBox="0 0 32 38" fill="none">' +
            '<path d="M16 0C7.163 0 0 7.163 0 16C0 27 16 38 16 38C16 38 32 27 32 16C32 7.163 24.837 0 16 0Z" fill="#ef4444"/>' +
            '<circle cx="16" cy="15" r="7" fill="#ffffff"/>' +
            '<path d="M14 11V19M14 11L19 13.5L14 16" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>' +
          '<div class="pin-shadow"></div>' +
        '</div>';

        var endIcon = L.divIcon({
          className: 'pin-end',
          html: endHtml,
          iconSize: [34, 42],
          iconAnchor: [17, 40]
        });

        endMarker = L.marker([endLat, endLng], { icon: endIcon }).addTo(map);
        if (endTitle) endMarker.bindPopup('<b>Destination:</b> ' + endTitle);
      }
    }

    function drawRoute(coordsJson, fit) {
      if (!map) return;
      clearRoute();

      try {
        var coords = (typeof coordsJson === 'string') ? JSON.parse(coordsJson) : coordsJson;
        if (!coords || coords.length === 0) return;

        var latLngs = coords.map(function(pt) {
          return [pt[0], pt[1]];
        });

        routePolylineBg = L.polyline(latLngs, {
          color: '#0369a1',
          weight: 8,
          opacity: 0.8,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(map);

        routePolyline = L.polyline(latLngs, {
          color: '#38bdf8',
          weight: 5,
          opacity: 1.0,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(map);

        if (fit) {
          map.fitBounds(routePolyline.getBounds(), {
            paddingTopLeft: [40, 80],
            paddingBottomRight: [40, 240],
            animate: true
          });
        }
      } catch (err) {
        console.error('Error drawing route:', err);
      }
    }

    function clearRoute() {
      if (!map) return;
      if (routePolylineBg) {
        map.removeLayer(routePolylineBg);
        routePolylineBg = null;
      }
      if (routePolyline) {
        map.removeLayer(routePolyline);
        routePolyline = null;
      }
      if (stepMarkers && stepMarkers.length) {
        stepMarkers.forEach(function(m) { map.removeLayer(m); });
        stepMarkers = [];
      }
    }

    function clearAll() {
      clearRoute();
      if (startMarker) {
        map.removeLayer(startMarker);
        startMarker = null;
      }
      if (endMarker) {
        map.removeLayer(endMarker);
        endMarker = null;
      }
    }

    // --- Custom Map Objects Management ---
    function renderCustomObjects(objectsJson) {
      if (!map) return;
      clearCustomObjects();

      try {
        var objects = (typeof objectsJson === 'string') ? JSON.parse(objectsJson) : objectsJson;
        if (!objects || !objects.length) return;

        objects.forEach(function(obj) {
          var color = obj.colorHex || '#0284c7';
          var lat = obj.latitude;
          var lng = obj.longitude;

          if (obj.objectType === 'circle' || obj.objectType === 'zone') {
            var radius = obj.radiusMeters || 150;
            var circle = L.circle([lat, lng], {
              radius: radius,
              color: color,
              weight: 2,
              fillColor: color,
              fillOpacity: 0.28
            });

            circle.on('click', function(e) {
              L.DomEvent.stopPropagation(e);
              if (window.AndroidBridge && window.AndroidBridge.onMapObjectClick) {
                window.AndroidBridge.onMapObjectClick(obj.id, obj.title, obj.objectType, lat, lng);
              }
            });

            circle.addTo(map);
            customObjectLayers[obj.id] = circle;
          } else {
            // Marker / Hazard / POI
            var iconSymbol = '📍';
            if (obj.objectType === 'hazard') iconSymbol = '⚠️';
            else if (obj.objectType === 'poi') iconSymbol = '⭐';
            else if (obj.objectType === 'camera') iconSymbol = '📷';

            var badgeHtml = '<div class="object-pin-badge" style="background-color:' + color + ';">' +
              '<span style="font-size:16px;">' + iconSymbol + '</span>' +
            '</div>';

            var icon = L.divIcon({
              className: 'custom-object-icon',
              html: badgeHtml,
              iconSize: [36, 36],
              iconAnchor: [18, 18]
            });

            var marker = L.marker([lat, lng], { icon: icon });
            marker.on('click', function(e) {
              L.DomEvent.stopPropagation(e);
              if (window.AndroidBridge && window.AndroidBridge.onMapObjectClick) {
                window.AndroidBridge.onMapObjectClick(obj.id, obj.title, obj.objectType, lat, lng);
              }
            });

            marker.addTo(map);
            customObjectLayers[obj.id] = marker;
          }
        });
      } catch (err) {
        console.error('Error rendering custom objects:', err);
      }
    }

    function clearCustomObjects() {
      if (!map) return;
      for (var id in customObjectLayers) {
        if (customObjectLayers.hasOwnProperty(id)) {
          map.removeLayer(customObjectLayers[id]);
        }
      }
      customObjectLayers = {};
    }

    function zoomIn() {
      if (map) map.zoomIn();
    }

    function zoomOut() {
      if (map) map.zoomOut();
    }

    window.onload = initMap;
  </script>
</body>
</html>
