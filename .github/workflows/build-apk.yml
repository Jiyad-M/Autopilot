name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Prepare build environment
        run: |
          # 1. Ensure .env exists in root and app/
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          cp -f .env app/.env || true

          # 2. Decode debug keystore if base64 exists, or generate fresh debug.keystore
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f debug.keystore app/debug.keystore || true

          # 3. Ensure release upload keystore exists in root and app/
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=LeafletNav, OU=Android, O=Leaflet, L=City, S=State, C=US"
          fi
          cp -f my-upload-key.jks app/my-upload-key.jks || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
          KEYSTORE_PATH: "${{ github.workspace }}/my-upload-key.jks"
        run: ./gradlew assembleRelease --stacktrace || echo "Release build warning"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LeafletNav-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
