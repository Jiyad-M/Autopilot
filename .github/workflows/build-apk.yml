name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: "android"
      KEY_PASSWORD: "android"
      KEYSTORE_PATH: "my-upload-key.jks"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build environment
        run: |
          # Ensure .env file exists for Secrets Gradle plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Decode debug keystore if present as base64
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Ensure release upload keystore exists
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=LeafletNav, OU=Android, O=Leaflet, L=City, S=State, C=US"
          fi

          # Make gradlew executable
          chmod +x ./gradlew || true

      - name: Build APKs with Gradle
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LeafletNav-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
